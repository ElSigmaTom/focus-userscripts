<!DOCTYPE html>
<html>
<head><title>FB Mock</title></head>
<body>
  <!-- Mock FB top bar with shortcut tablist -->
  <div role="navigation">
    <div role="tablist">
      <a role="link" aria-label="Home" href="/">Home</a>
      <a role="link" aria-label="Watch" href="/watch/">Watch</a>
      <a role="link" aria-label="Marketplace" href="/marketplace/">Marketplace</a>
      <a role="link" aria-label="Groups" href="/groups/">Groups</a>
      <a role="link" aria-label="Gaming" href="/gaming/">Gaming</a>
    </div>
    <a role="link" aria-label="Notifications">Notifications</a>
    <a role="link" aria-label="Friend requests">Friend requests</a>
  </div>

  <!-- Mock left sidebar via text-content matching -->
  <nav>
    <div class="x1lliihq"><span>Reels and short videos</span></div>
    <div class="x1qughib"><a role="link"><span>Reels</span></a></div>
    <div role="link"><span>Marketplace</span></div>
    <div role="link"><span>Watch</span></div>
    <div role="link"><span>Groups</span></div>
    <div role="link"><span>Gaming</span></div>
    <div role="link"><span>Friends</span></div>
    <div role="link"><span>Memories</span></div>
    <div role="link"><span>Saved</span></div>
  </nav>

  <!-- Mock thread list -->
  <div role="grid">
    <div role="row" aria-label="Conversation with Alice (unread)">
      <span style="font-weight: 700;">Alice</span>
      <span dir="auto">Hey, did you see this thing?</span>
      <span dir="auto">2h</span>
    </div>
    <div role="row" aria-label="Conversation with Bob">
      <span style="font-weight: 400;">Bob</span>
      <span dir="auto">Got the package, thanks!</span>
      <span dir="auto">Mon</span>
    </div>
  </div>

  <!-- Mock right rail sponsored -->
  <div role="complementary">
    <div aria-label="Sponsored">Buy this thing</div>
    <div aria-label="Marketplace suggestions">Marketplace items</div>
    <div aria-label="People you may know">Suggested friends</div>
  </div>

  <!-- Mock unread badge -->
  <span aria-label="3 unread notifications">3</span>
</body>
</html>
